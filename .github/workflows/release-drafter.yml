name: CI Release Draft

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
